name: Windows

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Builds the library (static + DLL) and the CLI on the two supported 64-bit
# Windows toolchains, MSVC and MinGW64, and smoke-tests the CLI end to end.
# The POSIX test harness (fork/exec IUT, socketpair/pthread, sigaction fuzz) is
# not built on Windows; the CLI smoke tests exercise the read/write/DOM paths.
# Smoke checks are split into one step per command so a failure pinpoints the
# offending command from the step status alone.

jobs:
  msvc:
    name: MSVC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure (Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build

      - name: Check artifacts + DLL exports
        shell: cmd
        run: |
          dir build
          if not exist build\bvnr.dll exit /b 1
          if not exist build\bvnr.lib exit /b 1
          if not exist build\bvnr_static.lib exit /b 1
          if not exist build\bovnar.exe exit /b 1
          dumpbin /exports build\bvnr.dll | findstr /i "bvnr_version bvnr_read"

      - name: Prepare sample document
        shell: pwsh
        run: Set-Content -NoNewline -Encoding ascii smoke.bvnr ".a = <uint:8> 7;`n.b = <float:64> 3.5;`n"

      - name: smoke - validate (file)
        shell: pwsh
        run: |
          & build\bovnar.exe validate smoke.bvnr
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print runs (file)
        shell: pwsh
        run: |
          & build\bovnar.exe pretty-print smoke.bvnr > pp.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print output
        shell: pwsh
        run: |
          Get-Content pp.txt
          if (-not (Select-String -Path pp.txt -Pattern '<uint:8>' -Quiet)) { Write-Error 'missing <uint:8>'; exit 1 }

      - name: smoke - events (binary-mode stdin)
        shell: pwsh
        run: |
          Get-Content -Raw smoke.bvnr | & build\bovnar.exe events -
          if ($LASTEXITCODE -ne 0) { exit 1 }

  mingw:
    name: MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build

      - name: Check artifacts + DLL is self-contained
        run: |
          ls -l build
          test -f build/libbvnr.a
          test -f build/libbvnr.dll
          test -f build/libbvnr.dll.a
          test -f build/bovnar.exe
          # No GCC runtime sidecar dependency (we link -static-libgcc -static).
          if objdump -p build/libbvnr.dll | grep -iE 'libgcc_s|libwinpthread|libstdc\+\+'; then
            echo "DLL has an unexpected GCC runtime dependency" && exit 1
          fi

      - name: Prepare sample document
        run: printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr

      - name: smoke - validate (file)
        run: ./build/bovnar.exe validate smoke.bvnr

      - name: smoke - pretty-print runs (file)
        run: ./build/bovnar.exe pretty-print smoke.bvnr > pp.txt

      - name: smoke - pretty-print output
        run: |
          cat pp.txt
          grep -q '<uint:8>' pp.txt

      - name: smoke - events (binary-mode stdin)
        run: printf '.x = "hi";\n' | ./build/bovnar.exe events -

  mingw-tests:
    name: MinGW64 (tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    # Builds the portable test subset with the MinGW toolchain and runs it
    # natively on the Windows runner (no Wine needed here — these are native
    # Windows .exe). The POSIX-only pieces (socketpair+pthread round-trip,
    # conformance --iut fork/exec, sigaction fuzz handler) and the Python
    # bindings are guarded out of the Windows build; this exercises the C unit
    # suite, the conformance self-test, the standalone fuzz smoke, and the CLI
    # example/convert/query/stream checks.
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja, tests on)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=ON .

      - name: Build
        run: cmake --build build

      - name: Test (ctest)
        # Exclude the deep/thorough fuzz variants (long-running stress versions of
        # the fuzz_smoke harnesses, which still run) to keep CI snappy.
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)" -LE "fuzz_deep|fuzz_thorough"

  mingw-cross-wine:
    name: MinGW64 cross (Ubuntu + Wine)
    runs-on: ubuntu-latest
    # Cross-compiles the Windows target from Linux with the mingw-w64 toolchain
    # and runs the test suite under Wine — the local-dev path. Unlike the native
    # MSYS2 jobs, this is what exercises cmake/toolchain-mingw-w64-x86_64.cmake,
    # its CMAKE_CROSSCOMPILING_EMULATOR=wine wiring (ctest runs each .exe through
    # Wine), and the -DEMULATOR= plumbing in the shared cmake/*.cmake CLI helpers.
    env:
      # noninteractive so a debconf prompt from a Wine dependency cannot hang the
      # apt install (apt-get -y does not suppress debconf on its own).
      DEBIAN_FRONTEND: noninteractive
      WINEARCH: win64
      WINEPREFIX: ${{ github.workspace }}/.wine
      WINEDEBUG: "-all"
      # Skip the wine-mono / wine-gecko installers; the CLI is a plain console app.
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross toolchain, Wine and Ninja
        # Keep the download small — the Azure apt mirror throughput on the
        # runners is highly variable, so every saved MB helps:
        #   * gcc-mingw-w64-x86-64-win32 (+ the dev headers) instead of the
        #     gcc-mingw-w64-x86-64 metapackage, which also pulls the unused posix
        #     GCC variant (~50 MB). win32 is the variant the local toolchain uses.
        #   * --no-install-recommends drops Wine's GUI/audio recommends and 32-bit
        #     wine32 (we only run a 64-bit console .exe).
        # Install BOTH wine and wine64: the wine64 package ships only
        # /usr/bin/wine64-stable; the /usr/bin/wine64 command is an
        # update-alternatives link registered via the `wine` package.
        # Acquire::Retries rides out transient mirror blips.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev ninja-build wine wine64

      - name: Initialize Wine prefix
        # Invoke wineboot via wine64 (the standalone /usr/bin/wineboot wrapper is
        # not part of the wine64 package) so the win64 prefix is created up front,
        # before the parallel ctest run touches it.
        run: |
          wine64 wineboot --init
          wineserver -w

      - name: Configure (cross toolchain, Ninja, tests on)
        run: |
          cmake -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=ON .
          # Fail loudly if the toolchain did not pick Wine up as the test emulator.
          grep -q '^CMAKE_CROSSCOMPILING_EMULATOR.*wine' build-mingw/CMakeCache.txt

      - name: Build
        run: cmake --build build-mingw

      - name: Test (ctest under Wine)
        # Same fuzz exclusion as the native job; ctest runs each .exe via the
        # CMAKE_CROSSCOMPILING_EMULATOR (wine) set by the toolchain file.
        run: ctest --test-dir build-mingw --output-on-failure --parallel "$(nproc)" -LE "fuzz_deep|fuzz_thorough"
