# nginx: serve Bovnar documents with the registered media type.
#
# Option A — add the type globally. Include this from inside the http{} block,
# e.g. in /etc/nginx/nginx.conf:
#
#     http {
#         include /etc/nginx/mime.types;
#         include /etc/nginx/conf.d/bovnar-mime.conf;   # this file
#         ...
#     }
#
# nginx merges this types{} block with the included mime.types, mapping the
# .bvnr extension to text/vnd.bovnar.
types {
    text/vnd.bovnar  bvnr;
}

# Emit "; charset=utf-8" on the Content-Type for Bovnar responses.
charset utf-8;
charset_types text/vnd.bovnar text/plain text/css application/javascript;

# ---------------------------------------------------------------------------
# Option B — if you cannot edit the global types{} (e.g. shared mime.types),
# set the type per-location instead, inside the relevant server{}/location{}:
#
#     location ~ \.bvnr$ {
#         default_type text/vnd.bovnar;
#         charset utf-8;
#         add_header Content-Type "text/vnd.bovnar; charset=utf-8";
#     }
# ---------------------------------------------------------------------------
