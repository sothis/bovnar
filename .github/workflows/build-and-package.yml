name: Build & Package

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

# Builds the library (static + shared) and the CLI on the supported 64-bit
# targets and publishes each as a downloadable release artifact:
#   * Windows MSVC  -> bovnar-windows-msvc
#   * Windows MinGW -> bovnar-windows-mingw
#   * Linux x64     -> bovnar-linux (+ the cross-platform bovnar-amalgamate)
# Each platform archive (packed by cmake/pack_artifacts.cmake) bundles the
# documentation (doc/), runnable examples (examples/) and editor syntax
# highlighters (highlighter/) alongside the headers, libs and CLI.
# Each job smoke-tests the CLI end to end (split one step per command so a
# failure pinpoints the offending command from the step status alone). The full
# C/Python suite runs in the `tests` job below: it used to be left to whoever
# remembered to run run_tests.sh locally, which meant nothing gated a push — the
# shipped WebAssembly artifact drifted 35 commits behind the library, an eol
# filter corrupted a tracked example so that a fresh clone failed to validate it,
# and four CTest gates could not fail at all, none of which anything noticed.
#
# It also builds the Python wheels + sdist (cibuildwheel matrix) and publishes
# them to PyPI on a v* tag. Those heavier jobs are gated (see their `if:`) to
# pull requests, main, and tags — not every release-* push.

jobs:
  msvc:
    name: MSVC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count (git commit count)
          # is meaningful rather than 1 from a shallow clone.
          fetch-depth: 0

      - name: Set up MSVC x64 environment
        # Maintained node24 equivalent of ilammy/msvc-dev-cmd, which has no
        # node24 release and so trips the Node-20 deprecation warning. Same job:
        # runs vcvarsall and exports the MSVC env to the following steps.
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure (Ninja)
        run: cmake -B build\msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build\msvc

      - name: Upload Windows artifact (MSVC)
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-windows-msvc
          path: build/msvc/bovnar-windows-*.zip
          if-no-files-found: error

      - name: Check artifacts + DLL exports
        shell: cmd
        run: |
          dir build\msvc
          if not exist build\msvc\bvnr.dll exit /b 1
          if not exist build\msvc\bvnr.lib exit /b 1
          if not exist build\msvc\bvnr_static.lib exit /b 1
          if not exist build\msvc\bovnar.exe exit /b 1
          dumpbin /exports build\msvc\bvnr.dll | findstr /i "bvnr_version bvnr_read"

      - name: Prepare sample document
        shell: pwsh
        run: Set-Content -NoNewline -Encoding ascii smoke.bvnr ".a = <uint:8> 7;`n.b = <float:64> 3.5;`n"

      - name: smoke - validate (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe validate smoke.bvnr
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print runs (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe pretty-print smoke.bvnr > pp.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print output
        shell: pwsh
        run: |
          Get-Content pp.txt
          if (-not (Select-String -Path pp.txt -Pattern '<uint:8>' -Quiet)) { Write-Error 'missing <uint:8>'; exit 1 }

      - name: smoke - events (binary-mode stdin)
        shell: pwsh
        run: |
          Get-Content -Raw smoke.bvnr | & build\msvc\bovnar.exe events -
          if ($LASTEXITCODE -ne 0) { exit 1 }

  mingw:
    name: MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count is meaningful.
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja)
        run: cmake -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build/mingw

      - name: Upload Windows artifact (MinGW)
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-windows-mingw
          path: build/mingw/bovnar-windows-*.zip
          if-no-files-found: error

      - name: Check artifacts + DLL is self-contained
        run: |
          ls -l build/mingw
          test -f build/mingw/libbvnr.a
          test -f build/mingw/libbvnr.dll
          test -f build/mingw/libbvnr.dll.a
          test -f build/mingw/bovnar.exe
          # No GCC runtime sidecar dependency (we link -static-libgcc -static).
          if objdump -p build/mingw/libbvnr.dll | grep -iE 'libgcc_s|libwinpthread|libstdc\+\+'; then
            echo "DLL has an unexpected GCC runtime dependency" && exit 1
          fi

      - name: Prepare sample document
        run: printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr

      - name: smoke - validate (file)
        run: ./build/mingw/bovnar.exe validate smoke.bvnr

      - name: smoke - pretty-print runs (file)
        run: ./build/mingw/bovnar.exe pretty-print smoke.bvnr > pp.txt

      - name: smoke - pretty-print output
        run: |
          cat pp.txt
          grep -q '<uint:8>' pp.txt

      - name: smoke - events (binary-mode stdin)
        run: printf '.x = "hi";\n' | ./build/mingw/bovnar.exe events -

  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-latest
    # Everything that gates correctness: the C suite (CTest), the conformance
    # suite, the fuzz tiers, the WebAssembly freshness check, and the Python
    # bindings. Kept separate from the packaging jobs so a test failure is
    # unambiguous and does not also block seeing whether the build itself works.
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: CTest
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      # From inside python/, as run_tests.sh does: the package is not installed,
      # so `bovnar` is only importable with that directory on sys.path.
      # LIBBOVNAR_PATH must be ABSOLUTE for the same reason -- it is read after
      # the cd -- and it is the name _ffi.py actually consults.
      - name: Python bindings
        run: |
          python3 -m pip install --quiet pytest
          cd python && LIBBOVNAR_PATH="$GITHUB_WORKSPACE/build/libbvnr.so" \
            python3 -m pytest tests -q

      # A second pass under the sanitizers. The Python tests are excluded: they
      # load libbvnr.so through ctypes into an unsanitized interpreter, which
      # ASan refuses outright.
      - name: Sanitizer build
        run: |
          cmake -B build-asan -DBVNR_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug .
          cmake --build build-asan -j"$(nproc)"

      - name: CTest (ASan + UBSan)
        run: ctest --test-dir build-asan -j"$(nproc)" -E '^bvnr_py_' --output-on-failure

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    # Native 64-bit Linux build (this is the Ubuntu runner that previously ran
    # the MinGW cross + Wine job). It builds the library + CLI and publishes the
    # packed Linux release tarball — and the cross-platform amalgamation — as
    # downloadable artifacts, mirroring the Windows jobs. gcc, make, cmake and
    # python3 are preinstalled on the runner, so no apt install is needed.
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count is meaningful.
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-linux
          path: build/bovnar-linux-*.tar.xz
          if-no-files-found: error

      - name: Upload amalgamation artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-amalgamate
          path: build/bovnar-*-amalgamate.tar.xz
          if-no-files-found: error

      - name: smoke - validate + pretty-print + events
        run: |
          printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr
          ./build/bovnar validate smoke.bvnr
          ./build/bovnar pretty-print smoke.bvnr | grep -q '<uint:8>'
          printf '.x = "hi";\n' | ./build/bovnar events -

  source:
    name: Source tarball
    runs-on: ubuntu-latest
    # A complete snapshot of the repository as a single tarball: every tracked
    # file — i.e. everything except what .gitignore excludes — with a clean
    # top-level directory. Packed with `git archive` (not `tar` over the working
    # tree) so the file set is exactly HEAD's tracked files, deterministic and
    # free of build output or local cruft. Runs on every trigger like the C
    # build jobs; the name mirrors the other release archives
    # (bovnar-<version>-<count>-source.tar.xz).
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `git rev-list --count HEAD` yields the true build
          # count (a shallow clone would report 1) — matches pack_artifacts.cmake.
          fetch-depth: 0

      - name: Pack source tarball
        run: |
          set -euo pipefail
          # Version from the single source of truth (project() in CMakeLists),
          # count = total commits, exactly as pack_artifacts.cmake derives them.
          version=$(grep -oP 'project\(bovnar VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          count=$(git rev-list --count HEAD)
          name="bovnar-${version}-${count}-source"
          git archive --format=tar --prefix="${name}/" HEAD | xz -9 > "${name}.tar.xz"
          ls -l "${name}.tar.xz"
          echo "SRC_TARBALL=${name}.tar.xz" >> "$GITHUB_ENV"

      - name: Verify tarball is exactly the tracked file set
        run: |
          set -euo pipefail
          prefix="${SRC_TARBALL%.tar.xz}/"
          # Files in the archive (drop directory entries and the prefix), sorted.
          tar -tJf "$SRC_TARBALL" | grep -v '/$' | sed "s#^${prefix}##" | LC_ALL=C sort > archived.txt
          git ls-files | LC_ALL=C sort > tracked.txt
          if ! diff -u tracked.txt archived.txt; then
            echo "::error::source tarball contents differ from the tracked file set" >&2
            exit 1
          fi
          echo "OK: $(wc -l < tracked.txt) tracked files archived, nothing ignored included"

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-source
          path: ${{ env.SRC_TARBALL }}
          if-no-files-found: error

  # ── Python distribution ──────────────────────────────────────────────────
  # The wheel/sdist jobs are heavy (cibuildwheel across Linux x86_64 + arm64 and
  # macOS), so — unlike the C build/package jobs above — they do NOT run on every
  # release-* push. The `if:` keeps them to their prior triggers: pull requests,
  # workflow_dispatch, pushes to main, and v* tags. Publishing to PyPI stays
  # gated to v* tags only (the `publish` job's own `if:`).
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64 (native runner)
          - macos-14           # arm64 native + x86_64 cross-compiled
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        # v3.x ships CPython 3.14 final support (cp314); needed for the
        # cp314-* entry in [tool.cibuildwheel].build. Pinned to v3.4 (still the
        # v3 line) because v3.2+ bundles actions/setup-python@v6, which runs on
        # node24 — v3.1 pulled in setup-python@v5 and tripped the Node-20
        # deprecation warning.
        uses: pypa/cibuildwheel@v3.4

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          # Fail loudly rather than publish an incomplete (immutable) PyPI release
          # if a matrix leg ever produces an empty wheelhouse.
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        # `pipx run build` no longer resolves (the package's executable is
        # `pyproject-build`); name it explicitly so the sdist is actually built.
        run: pipx run --spec build pyproject-build --sdist

      - name: Check metadata
        # Only the built sdist — the repo has a committed dist/ (registration
        # assets: dist/README.md, dist/mime/, …), so a bare dist/* glob feeds
        # those to twine and errors "Unknown distribution format: 'README.md'".
        run: pipx run twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-source
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on a version tag (e.g. v1.1.0).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/bovnar
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
