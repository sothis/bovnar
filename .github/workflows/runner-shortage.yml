name: Runner shortage retry

# When GitHub has no hosted runner for a job (macOS arm64 runners run short now and
# then), it cancels the job after about fifteen minutes with "The job was not acquired
# by Runner of type hosted even after multiple attempts", and every job that needs it
# is skipped. On a tag that skips the release and the publish jobs; v2.0.1 needed five
# attempts for that alone, each re-run by hand.
#
# After each Build & Package run of a push that did not succeed, this asks
# .github/scripts/runner-shortage.sh whether a missing runner is the only reason. If so,
# it waits five minutes and re-runs the failed jobs (their dependents with them), up to
# attempt 6. A run with a real failure, one cancelled by a newer push or by hand, and a
# branch run its branch has moved on from are left as they are. Pull request runs are
# left to whoever opened them.
on:
  workflow_run:
    workflows: ["Build & Package"]
    types: [completed]

permissions:
  actions: write   # re-run the failed jobs
  checks: read     # read why a job was cancelled (its annotations)
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt < 6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Re-run the jobs GitHub found no runner for
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          verdict=$(.github/scripts/runner-shortage.sh "$GITHUB_REPOSITORY" "$RUN" "$ATTEMPT")
          echo "run $RUN attempt $ATTEMPT: $verdict"
          [ "$verdict" = retry ] || exit 0
          # The pool may still be short a minute later; five gives it a chance.
          sleep 300
          # Asked again: a newer push may have landed while this waited.
          verdict=$(.github/scripts/runner-shortage.sh "$GITHUB_REPOSITORY" "$RUN" "$ATTEMPT")
          [ "$verdict" = retry ] || { echo "run $RUN: $verdict"; exit 0; }
          gh run rerun "$RUN" --failed -R "$GITHUB_REPOSITORY"
          echo "::notice::re-ran the failed jobs of run $RUN (attempt $ATTEMPT): GitHub had found no runner for them"
