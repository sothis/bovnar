name: Windows

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Builds the library (static + DLL) and the CLI on the two supported 64-bit
# Windows toolchains, MSVC and MinGW64, and smoke-tests the CLI end to end.
# The POSIX test harness (fork/exec IUT, socketpair/pthread, sigaction fuzz) is
# not built on Windows; the CLI smoke tests exercise the read/write/DOM paths.
# Smoke checks are split into one step per command so a failure pinpoints the
# offending command from the step status alone.

jobs:
  msvc:
    name: MSVC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure (Ninja)
        run: cmake -B build\msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build\msvc

      - name: Check artifacts + DLL exports
        shell: cmd
        run: |
          dir build\msvc
          if not exist build\msvc\bvnr.dll exit /b 1
          if not exist build\msvc\bvnr.lib exit /b 1
          if not exist build\msvc\bvnr_static.lib exit /b 1
          if not exist build\msvc\bovnar.exe exit /b 1
          dumpbin /exports build\msvc\bvnr.dll | findstr /i "bvnr_version bvnr_read"

      - name: Prepare sample document
        shell: pwsh
        run: Set-Content -NoNewline -Encoding ascii smoke.bvnr ".a = <uint:8> 7;`n.b = <float:64> 3.5;`n"

      - name: smoke - validate (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe validate smoke.bvnr
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print runs (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe pretty-print smoke.bvnr > pp.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print output
        shell: pwsh
        run: |
          Get-Content pp.txt
          if (-not (Select-String -Path pp.txt -Pattern '<uint:8>' -Quiet)) { Write-Error 'missing <uint:8>'; exit 1 }

      - name: smoke - events (binary-mode stdin)
        shell: pwsh
        run: |
          Get-Content -Raw smoke.bvnr | & build\msvc\bovnar.exe events -
          if ($LASTEXITCODE -ne 0) { exit 1 }

  mingw:
    name: MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja)
        run: cmake -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build/mingw

      - name: Check artifacts + DLL is self-contained
        run: |
          ls -l build/mingw
          test -f build/mingw/libbvnr.a
          test -f build/mingw/libbvnr.dll
          test -f build/mingw/libbvnr.dll.a
          test -f build/mingw/bovnar.exe
          # No GCC runtime sidecar dependency (we link -static-libgcc -static).
          if objdump -p build/mingw/libbvnr.dll | grep -iE 'libgcc_s|libwinpthread|libstdc\+\+'; then
            echo "DLL has an unexpected GCC runtime dependency" && exit 1
          fi

      - name: Prepare sample document
        run: printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr

      - name: smoke - validate (file)
        run: ./build/mingw/bovnar.exe validate smoke.bvnr

      - name: smoke - pretty-print runs (file)
        run: ./build/mingw/bovnar.exe pretty-print smoke.bvnr > pp.txt

      - name: smoke - pretty-print output
        run: |
          cat pp.txt
          grep -q '<uint:8>' pp.txt

      - name: smoke - events (binary-mode stdin)
        run: printf '.x = "hi";\n' | ./build/mingw/bovnar.exe events -

  mingw-tests:
    name: MinGW64 (tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    # Builds the portable test subset with the MinGW toolchain and runs it
    # natively on the Windows runner (no Wine needed here — these are native
    # Windows .exe). The POSIX-only pieces (socketpair+pthread round-trip,
    # conformance --iut fork/exec, sigaction fuzz handler) and the Python
    # bindings are guarded out of the Windows build; this exercises the C unit
    # suite, the conformance self-test, the standalone fuzz smoke, and the CLI
    # example/convert/query/stream checks.
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja, tests on)
        run: cmake -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=ON .

      - name: Build
        run: cmake --build build/mingw

      - name: Test (ctest)
        # Exclude the deep/thorough fuzz variants (long-running stress versions of
        # the fuzz_smoke harnesses, which still run) to keep CI snappy.
        run: ctest --test-dir build/mingw --output-on-failure --parallel "$(nproc)" -LE "fuzz_deep|fuzz_thorough"

  mingw-cross-wine:
    name: MinGW64 cross (Ubuntu + Wine)
    runs-on: ubuntu-latest
    # Non-blocking: the native MinGW64 (tests) job is the required Windows test
    # signal. This job adds coverage of the local-dev cross path but depends on
    # apt-installing Wine + the mingw toolchain from the runners' Azure mirror,
    # whose throughput is sometimes pathologically slow; continue-on-error keeps a
    # bad-mirror day from gating the whole workflow. (The apt cache makes this
    # rare once warm.) Inspect its result manually when the cross path itself
    # changes.
    continue-on-error: true
    # Cross-compiles the Windows target from Linux with the mingw-w64 toolchain
    # and runs the test suite under Wine — the local-dev path. Unlike the native
    # MSYS2 jobs, this is what exercises cmake/toolchain-mingw-w64-x86_64.cmake,
    # its CMAKE_CROSSCOMPILING_EMULATOR=wine wiring (ctest runs each .exe through
    # Wine), and the -DEMULATOR= plumbing in the shared cmake/*.cmake CLI helpers.
    env:
      # noninteractive so a debconf prompt from a Wine dependency cannot hang the
      # apt install (apt-get -y does not suppress debconf on its own).
      DEBIAN_FRONTEND: noninteractive
      WINEARCH: win64
      WINEPREFIX: ${{ github.workspace }}/.wine
      WINEDEBUG: "-all"
      # Skip the wine-mono / wine-gecko installers; the CLI is a plain console app.
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v5

      # Cache the downloaded .deb archives so repeat runs skip the (often very
      # slow) Azure apt mirror entirely. apt's archive dir is redirected to a
      # workspace-local path (Dir::Cache::archives below) so it is owned by the
      # runner user and this action can read it. Keyed on the workflow file, so
      # editing the package list invalidates the cache; the prefix restore-key
      # reuses the newest cache across unrelated workflow edits.
      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.apt-cache
          key: apt-cross-wine-${{ runner.os }}-${{ hashFiles('.github/workflows/windows.yml') }}
          restore-keys: apt-cross-wine-${{ runner.os }}-

      - name: Install mingw-w64 cross toolchain, Wine and Ninja
        # Minimal set — the Azure apt mirror throughput on the runners is highly
        # variable, so every saved MB helps:
        #   * gcc-mingw-w64-x86-64-win32 (+ the dev headers) instead of the
        #     gcc-mingw-w64-x86-64 metapackage, which also pulls the unused posix
        #     GCC variant (~50 MB). win32 is the variant the local toolchain uses.
        #   * wine64 only — it Depends on libwine, which ships both the loader and
        #     wine.inf (used to populate the prefix). No `wine`/`wine-common`
        #     (the latter does not even exist on this runner's Ubuntu), no 32-bit
        #     wine: we only run a 64-bit console .exe.
        #   * --no-install-recommends drops Wine's GUI/audio recommends;
        #     Acquire::Retries rides out transient mirror blips.
        # Dir::Cache::archives points apt at the cached .deb dir above (a cache hit
        # then needs no download). The distro exposes wine via update-alternatives
        # (libwine's wine.collection group), which is NOT reliably configured in a
        # minimal install, so /usr/bin/wine64 can be absent. Put the concrete
        # wine64 binary on PATH ourselves (name varies: wine64-stable /
        # -development), where the toolchain's find_program(wine64) picks it up as
        # the test emulator.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.apt-cache"
          sudo apt-get update
          # APT::Sandbox::User=root: the workspace-local archive dir is not
          # writable by the unprivileged _apt sandbox user, so apt would otherwise
          # print a "Download is performed unsandboxed as root ... Permission
          # denied" warning for every package. Downloading as root (we are already
          # root via sudo) is fine here and silences that noise.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$GITHUB_WORKSPACE/.apt-cache" \
            -o APT::Sandbox::User=root \
            gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev ninja-build wine64
          # apt ran as root, so the cached .deb files are root-owned; hand them
          # back to the runner user so the actions/cache post-step can archive them.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.apt-cache"
          if ! command -v wine64 >/dev/null 2>&1; then
            for c in /usr/bin/wine64-stable /usr/bin/wine64-development /usr/lib/wine/wine64; do
              if [ -x "$c" ]; then sudo ln -sf "$c" /usr/local/bin/wine64; break; fi
            done
          fi
          wine64 --version

      - name: Initialize Wine prefix
        # Create the win64 prefix up front (wineboot is a Wine builtin, run via
        # wine64) so the parallel ctest run does not race on first-run creation.
        run: wine64 wineboot --init

      - name: Configure (cross toolchain, Ninja, tests on)
        run: |
          cmake -B build/mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=ON .
          # Fail loudly if the toolchain did not pick Wine up as the test emulator.
          grep -q '^CMAKE_CROSSCOMPILING_EMULATOR.*wine' build/mingw/CMakeCache.txt

      - name: Build
        run: cmake --build build/mingw

      - name: Test (ctest under Wine)
        # Same fuzz exclusion as the native job; ctest runs each .exe via the
        # CMAKE_CROSSCOMPILING_EMULATOR (wine) set by the toolchain file.
        run: ctest --test-dir build/mingw --output-on-failure --parallel "$(nproc)" -LE "fuzz_deep|fuzz_thorough"
