name: Windows

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Builds the library (static + DLL) and the CLI on the two supported 64-bit
# Windows toolchains, MSVC and MinGW64, and smoke-tests the CLI end to end.
# The POSIX test harness (fork/exec IUT, socketpair/pthread, sigaction fuzz) is
# not built on Windows; the CLI smoke test exercises the read/write/DOM paths.

jobs:
  msvc:
    name: MSVC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio, x64)
        run: cmake -B build -A x64 -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build --config Release

      - name: List artifacts + check DLL exports
        shell: cmd
        run: |
          dir build\Release
          dumpbin /exports build\Release\bvnr.dll | findstr /i "bvnr_version bvnr_read bvnr_write_event"
          if not exist build\Release\bvnr_static.lib exit /b 1
          if not exist build\Release\bvnr.lib exit /b 1
          if not exist build\Release\bvnr.dll exit /b 1

      - name: CLI smoke test
        shell: pwsh
        run: |
          Set-Content -NoNewline -Encoding ascii smoke.bvnr ".a = <uint:8> 7;`n.b = <float:64> 3.5;`n"
          & build\Release\bovnar.exe validate smoke.bvnr
          if ($LASTEXITCODE -ne 0) { throw "validate failed" }
          $out = & build\Release\bovnar.exe pretty-print smoke.bvnr
          if ($LASTEXITCODE -ne 0) { throw "pretty-print failed" }
          Write-Host $out
          if ($out -notmatch '<uint:8>') { throw "unexpected pretty-print output" }
          # stdin path (exercises Windows binary-mode stdin via '-').
          Get-Content -Raw smoke.bvnr | & build\Release\bovnar.exe events -
          if ($LASTEXITCODE -ne 0) { throw "events stdin failed" }

  mingw:
    name: MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build

      - name: List artifacts + check DLL is self-contained
        run: |
          ls -l build
          test -f build/libbvnr.a
          test -f build/libbvnr.dll
          test -f build/libbvnr.dll.a
          # No GCC runtime sidecar dependency (we link -static-libgcc -static).
          if objdump -p build/libbvnr.dll | grep -iE 'libgcc_s|libwinpthread|libstdc\+\+'; then
            echo "DLL has an unexpected GCC runtime dependency" && exit 1
          fi
          objdump -p build/libbvnr.dll | grep -i 'DLL Name' || true

      - name: CLI smoke test
        run: |
          printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr
          ./build/bovnar.exe validate smoke.bvnr
          ./build/bovnar.exe pretty-print smoke.bvnr | tee out.txt
          grep -q '<uint:8>' out.txt
          # stdin path (exercises Windows binary-mode stdin via '-').
          printf '.x = "hi";\n' | ./build/bovnar.exe events -
