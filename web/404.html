<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>404 — Page not found · Bovnar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
:root {
  --bg: #f4f6f8; --fg: #1c2530; --muted: #5a6675; --card: #ffffff;
  --border: #dfe3e8; --accent: #0a85d6; --accent-2: #33a78f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --fg: #e6ebf0; --muted: #9aa6b2; --card: #1c2229;
    --border: #2a323b; --accent: #6cb0ea; --accent-2: #4ec9b0;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 2rem;
}
main {
  max-width: 40rem; width: 100%; text-align: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 3rem 2rem;
}
svg.mark { width: 72px; height: 72px; }
h1 { font-size: 3.4rem; margin: 1rem 0 0.2rem; letter-spacing: -0.02em; }
p.tag { font-size: 1.15rem; margin: 0 0 0.4rem; }
p.lead { color: var(--muted); margin: 0 auto 1.8rem; max-width: 30rem; }
.links { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
a.btn {
  text-decoration: none; color: var(--fg);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 0.55rem 1rem; background: transparent; transition: border-color .15s;
}
a.btn:hover { border-color: var(--accent); }
a.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--bg); padding: 0.1em 0.4em; border-radius: 4px;
}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb0ea"/><stop offset="1" stop-color="#0a85d6"/>
    </linearGradient></defs>
    <path d="M28 13 L12.5 32 L28 51" fill="none" stroke="url(#g)" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 13 L51.5 32 L36 51" fill="none" stroke="url(#g)" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#33a78f"/>
    <path d="M32 20 L20 32 L32 32 Z" fill="#9cdcfe"/>
    <path d="M32 20 L44 32 L32 32 Z" fill="#4ec9b0"/>
    <path d="M20 32 L32 44 L32 32 Z" fill="#3fb89e"/>
    <path d="M44 32 L32 44 L32 32 Z" fill="#2c9281"/>
  </svg>
  <h1>404</h1>
  <p class="tag">This value has no unit — and this URL has no page.</p>
  <p class="lead">The page you asked for was moved or never existed. Everything below still parses cleanly.</p>
  <div class="links">
    <a class="btn primary" href="/">Home</a>
    <a class="btn" href="/#docs">Documentation</a>
    <a class="btn" href="/#playground">Playground</a>
    <a class="btn" href="https://github.com/sothis/bovnar">GitHub</a>
  </div>
</main>
</body>
</html>
