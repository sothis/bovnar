name: Build & Package

on:
  push:
    branches: [main, 'release-*']
    # Exactly vMAJOR.MINOR.PATCH. 'v*' also matched vnext, v2 and v2.0.0-rc1,
    # and a tag here publishes to PyPI -- of whatever version CMakeLists says.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

# Never cancel a run on a TAG. That run publishes, and a second run on the same
# ref -- "Run workflow" with the tag selected, or the tag re-pushed -- would stop
# it midway: half a PyPI upload cannot be taken back.
concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Builds the library (static + shared) and the CLI on the supported 64-bit
# targets and publishes each as a downloadable release artifact:
#   * Windows MSVC  -> bovnar-windows-msvc
#   * Windows MinGW -> bovnar-windows-mingw
#   * Linux x64     -> bovnar-linux (+ the cross-platform bovnar-amalgamate)
# Each platform archive (packed by cmake/pack_artifacts.cmake) bundles the
# documentation (doc/), runnable examples (examples/) and editor syntax
# highlighters (highlighter/) alongside the headers, libs and CLI.
# Those uploads are Actions artifacts, which GitHub deletes after 90 days. On a
# v* tag the `release` job at the bottom re-publishes the same archives as GitHub
# Release assets, which are permanent and downloadable without an Actions login.
# Each job smoke-tests the CLI end to end (split one step per command so a
# failure pinpoints the offending command from the step status alone). The full
# C/Python suite runs in the `tests` job below: it used to be left to whoever
# remembered to run run_tests.sh locally, which meant nothing gated a push — the
# shipped WebAssembly artifact drifted 35 commits behind the library, an eol
# filter corrupted a tracked example so that a fresh clone failed to validate it,
# and four CTest gates could not fail at all, none of which anything noticed.
#
# It also builds the Python wheels + sdist (cibuildwheel matrix) and publishes
# them to PyPI on a v* tag. Those heavier jobs are gated (see their `if:`) to
# pull requests, main, and tags — not every release-* push.

jobs:
  msvc:
    name: MSVC (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count (git commit count)
          # is meaningful rather than 1 from a shallow clone.
          fetch-depth: 0

      - name: Set up MSVC x64 environment
        # Maintained node24 equivalent of ilammy/msvc-dev-cmd, which has no
        # node24 release and so trips the Node-20 deprecation warning. Same job:
        # runs vcvarsall and exports the MSVC env to the following steps.
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure (Ninja)
        run: cmake -B build\msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build\msvc

      - name: Upload Windows artifact (MSVC)
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-windows-msvc
          path: build/msvc/bovnar-windows-*.zip
          if-no-files-found: error

      - name: Check artifacts + DLL exports
        shell: cmd
        run: |
          dir build\msvc
          if not exist build\msvc\bvnr.dll exit /b 1
          if not exist build\msvc\bvnr.lib exit /b 1
          if not exist build\msvc\bvnr_static.lib exit /b 1
          if not exist build\msvc\bovnar.exe exit /b 1
          dumpbin /exports build\msvc\bvnr.dll | findstr /i "bvnr_version bvnr_read"

      - name: Prepare sample document
        shell: pwsh
        run: Set-Content -NoNewline -Encoding ascii smoke.bvnr ".a = <uint:8> 7;`n.b = <float:64> 3.5;`n"

      - name: smoke - validate (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe validate smoke.bvnr
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print runs (file)
        shell: pwsh
        run: |
          & build\msvc\bovnar.exe pretty-print smoke.bvnr > pp.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: smoke - pretty-print output
        shell: pwsh
        run: |
          Get-Content pp.txt
          if (-not (Select-String -Path pp.txt -Pattern '<uint:8>' -Quiet)) { Write-Error 'missing <uint:8>'; exit 1 }

      - name: smoke - events (binary-mode stdin)
        shell: pwsh
        run: |
          Get-Content -Raw smoke.bvnr | & build\msvc\bovnar.exe events -
          if ($LASTEXITCODE -ne 0) { exit 1 }

  mingw:
    name: MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count is meaningful.
          fetch-depth: 0

      # `git` is in this list because pack_artifacts.cmake shells out to it for
      # the build count and falls back to 0 when it cannot — a fallback meant for
      # builds from the source tarball, which has no .git. The MINGW64 shell had
      # no git at all, so this job alone stamped every Windows archive
      # bovnar-windows-<version>-0, in the zip name AND in its internal directory
      # prefix, while MSVC and Linux got the real count. It shipped that way in
      # the v1.1.0 assets before anyone noticed.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure (Ninja)
        run: cmake -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build/mingw

      - name: Upload Windows artifact (MinGW)
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-windows-mingw
          path: build/mingw/bovnar-windows-*.zip
          if-no-files-found: error

      - name: Check artifacts + DLL is self-contained
        run: |
          ls -l build/mingw
          test -f build/mingw/libbvnr.a
          test -f build/mingw/libbvnr.dll
          test -f build/mingw/libbvnr.dll.a
          test -f build/mingw/bovnar.exe
          # No GCC runtime sidecar dependency (we link -static-libgcc -static).
          if objdump -p build/mingw/libbvnr.dll | grep -iE 'libgcc_s|libwinpthread|libstdc\+\+'; then
            echo "DLL has an unexpected GCC runtime dependency" && exit 1
          fi

      - name: Prepare sample document
        run: printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr

      - name: smoke - validate (file)
        run: ./build/mingw/bovnar.exe validate smoke.bvnr

      - name: smoke - pretty-print runs (file)
        run: ./build/mingw/bovnar.exe pretty-print smoke.bvnr > pp.txt

      - name: smoke - pretty-print output
        run: |
          cat pp.txt
          grep -q '<uint:8>' pp.txt

      - name: smoke - events (binary-mode stdin)
        run: printf '.x = "hi";\n' | ./build/mingw/bovnar.exe events -

  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-latest
    # Everything that gates correctness: the C suite (CTest), the conformance
    # suite, the fuzz tiers, the WebAssembly freshness check, and the Python
    # bindings. Kept separate from the packaging jobs so a test failure is
    # unambiguous and does not also block seeing whether the build itself works.
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, as the packaging jobs already take: bvnr_html_docs
          # regenerates pages whose meta tags and schema.org dates come from
          # `git log -- doc/<file>`. The default depth-1 checkout has no per-file
          # history -- its one grafted commit answers for every path -- so every
          # doc dated as written today and all ten pages read as stale.
          fetch-depth: 0

      # Ahead of Configure, not somewhere after CTest: CMakeLists_tests.txt
      # probes for pytest at CONFIGURE time and skips the 19 bvnr_py_* gates
      # without it. Installing later therefore bought nothing -- the first run of
      # this job registered those gates against a runner whose interpreter had no
      # pytest and every one of them failed. A setup-python toolchain rather than
      # the runner's /usr/bin/python3, because the latter is an
      # externally-managed distro interpreter that refuses `pip install`; this
      # one lands first on PATH, which is what find_package(Python3) then picks.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # numpy is not optional here even though test_numpy_bridge.py
      # importorskip()s it: skipping is how bvnr_py_numpy silently tested nothing
      # (and, worse, failed -- a collection-time skip exits 5). The runner has no
      # numpy, so without this the bridge ships unexercised by CI.
      #
      # markdown is what gen_html_docs.py imports; without it bvnr_html_docs
      # fails with "No module named 'markdown'" rather than checking anything.
      # It is a hard requirement of this job, not an optional extra -- the
      # generated web/docs pages are committed, so this is the only gate that
      # catches a doc/*.md edit that never went through the generator.
      #
      # pygments is PINNED, and it has to be. pytest pulls in whatever is newest,
      # codehilite renders the docs' code blocks through it, and 2.21 stopped
      # escaping quotes in its HTML -- so bvnr_html_docs compared the committed
      # pages against a regeneration that differed in every code block and
      # failed on eleven of them, for a change nobody here made. The committed
      # web/docs pages are generated with this version; bump the pin and
      # regenerate them in the same commit.
      - name: Install Python test dependencies
        run: python3 -m pip install --quiet pytest numpy 'markdown==3.10.2' 'pygments==2.19.2'

      # -DPython3_EXECUTABLE pins the resolution to the interpreter just
      # provisioned instead of leaving FindPython3 to choose among the several on
      # the runner -- only this one has pytest.
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython3_EXECUTABLE="$(command -v python3)" .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The module-dependent gates skip themselves at configure time when their
      # import is missing, so a broken install step above would turn a failing
      # suite into a quietly smaller one. Assert the registrations exist before
      # trusting the run that follows.
      - name: Optional-dependency gates registered
        run: |
          set -euo pipefail
          for t in bvnr_html_docs bvnr_py_numpy bvnr_py_all; do
            ctest --test-dir build -N -R "^$t$" | grep -q "$t" \
              || { echo "::error::$t was not registered -- a Python dependency is missing"; exit 1; }
          done

      - name: CTest
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      # From inside python/, as run_tests.sh does: the package is not installed,
      # so `bovnar` is only importable with that directory on sys.path.
      # LIBBOVNAR_PATH must be ABSOLUTE for the same reason -- it is read after
      # the cd -- and it is the name _ffi.py actually consults.
      - name: Python bindings
        run: |
          cd python && LIBBOVNAR_PATH="$GITHUB_WORKSPACE/build/libbvnr.so" \
            python3 -m pytest tests -q

      # A second pass under the sanitizers. The Python tests are excluded: they
      # load libbvnr.so through ctypes into an unsanitized interpreter, which
      # ASan refuses outright ("ASan runtime does not come first in initial
      # library list").
      - name: Sanitizer build
        run: |
          cmake -B build-asan -DBVNR_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug .
          cmake --build build-asan -j"$(nproc)"

      # -LE python, not -E '^bvnr_py_': the thing that cannot run here is
      # "drives the library from a Python interpreter", which is what the label
      # records -- the name prefix only approximates it. bvnr_data_parity is
      # exactly that kind of test under a name the prefix does not match, so it
      # ran, hit the ctypes-into-unsanitized-interpreter wall and failed.
      - name: CTest (ASan + UBSan)
        run: ctest --test-dir build-asan -j"$(nproc)" -LE python --output-on-failure

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    # Native 64-bit Linux build (this is the Ubuntu runner that previously ran
    # the MinGW cross + Wine job). It builds the library + CLI and publishes the
    # packed Linux release tarball — and the cross-platform amalgamation — as
    # downloadable artifacts, mirroring the Windows jobs. gcc, make, cmake and
    # python3 are preinstalled on the runner, so no apt install is needed.
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the packed artifact's build count is meaningful.
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=OFF .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-linux
          path: build/bovnar-linux-*.tar.xz
          if-no-files-found: error

      - name: Upload amalgamation artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-amalgamate
          path: build/bovnar-*-amalgamate.tar.xz
          if-no-files-found: error

      - name: smoke - validate + pretty-print + events
        run: |
          printf '.a = <uint:8> 7;\n.b = <float:64> 3.5;\n' > smoke.bvnr
          ./build/bovnar validate smoke.bvnr
          ./build/bovnar pretty-print smoke.bvnr | grep -q '<uint:8>'
          printf '.x = "hi";\n' | ./build/bovnar events -

  source:
    name: Source tarball
    runs-on: ubuntu-latest
    # A complete snapshot of the repository as a single tarball: every tracked
    # file — i.e. everything except what .gitignore excludes — with a clean
    # top-level directory. Packed with `git archive` (not `tar` over the working
    # tree) so the file set is exactly HEAD's tracked files, deterministic and
    # free of build output or local cruft. Runs on every trigger like the C
    # build jobs; the name mirrors the other release archives
    # (bovnar-<version>-<count>-source.tar.xz).
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `git rev-list --count HEAD` yields the true build
          # count (a shallow clone would report 1) — matches pack_artifacts.cmake.
          fetch-depth: 0

      - name: Pack source tarball
        run: |
          set -euo pipefail
          # Version from the single source of truth (project() in CMakeLists),
          # count = total commits, exactly as pack_artifacts.cmake derives them.
          version=$(grep -oP 'project\(bovnar VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          count=$(git rev-list --count HEAD)
          name="bovnar-${version}-${count}-source"
          git archive --format=tar --prefix="${name}/" HEAD | xz -9 > "${name}.tar.xz"
          ls -l "${name}.tar.xz"
          echo "SRC_TARBALL=${name}.tar.xz" >> "$GITHUB_ENV"

      - name: Verify tarball is exactly the tracked file set
        run: |
          set -euo pipefail
          prefix="${SRC_TARBALL%.tar.xz}/"
          # Files in the archive (drop directory entries and the prefix), sorted.
          tar -tJf "$SRC_TARBALL" | grep -v '/$' | sed "s#^${prefix}##" | LC_ALL=C sort > archived.txt
          git ls-files | LC_ALL=C sort > tracked.txt
          if ! diff -u tracked.txt archived.txt; then
            echo "::error::source tarball contents differ from the tracked file set" >&2
            exit 1
          fi
          echo "OK: $(wc -l < tracked.txt) tracked files archived, nothing ignored included"

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: bovnar-source
          path: ${{ env.SRC_TARBALL }}
          if-no-files-found: error

  # ── Python distribution ──────────────────────────────────────────────────
  # The wheel/sdist jobs are heavy (cibuildwheel across Linux x86_64 + arm64 and
  # macOS), so — unlike the C build/package jobs above — they do NOT run on every
  # release-* push. The `if:` keeps them to their prior triggers: pull requests,
  # workflow_dispatch, pushes to main, and v* tags. Publishing to PyPI stays
  # gated to v* tags only (the `publish` job's own `if:`).
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64 (native runner)
          # macos-15, not -14: GitHub retires the macOS 14 images on
          # 2026-11-02 and fails jobs on them in announced brownout windows
          # through October (actions/runner-images#13518). cibuildwheel sets
          # the deployment target itself, so the wheel tags do not move.
          - macos-15           # arm64 native + x86_64 cross-compiled
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        # v3.x ships CPython 3.14 final support (cp314); needed for the
        # cp314-* entry in [tool.cibuildwheel].build. Pinned to v3.4 (still the
        # v3 line) because v3.2+ bundles actions/setup-python@v6, which runs on
        # node24 — v3.1 pulled in setup-python@v5 and tripped the Node-20
        # deprecation warning.
        uses: pypa/cibuildwheel@v3.4

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          # Fail loudly rather than publish an incomplete (immutable) PyPI release
          # if a matrix leg ever produces an empty wheelhouse.
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        # `pipx run build` no longer resolves (the package's executable is
        # `pyproject-build`); name it explicitly so the sdist is actually built.
        run: pipx run --spec build pyproject-build --sdist

      - name: Check metadata
        # Only the built sdist — the repo has a committed dist/ (registration
        # assets: dist/README.md, dist/mime/, …), so a bare dist/* glob feeds
        # those to twine and errors "Unknown distribution format: 'README.md'".
        run: pipx run twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-source
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # `tests` is here because a PyPI release is immutable. Without it a tag
    # whose test job failed still published its wheels -- while `release`,
    # which does wait for the tests, attached nothing: a version on PyPI with
    # no GitHub release behind it and a red suite.
    needs: [build_wheels, build_sdist, tests, release]
    runs-on: ubuntu-latest
    # Only publish on a version tag (e.g. v1.1.0).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/bovnar
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      # skip-existing: an upload that fails partway leaves some of the ~20 files
      # on PyPI for good, and without this a re-run stops at the first of them
      # with "File already exists" -- by which time the GitHub release is
      # already published and cannot be withdrawn either.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── GitHub Release assets ────────────────────────────────────────────────
  release:
    name: Attach archives to the release
    # `tests` is in here alongside the four packaging jobs on purpose: a release
    # asset is permanent and public, so it must not be able to ship from a tag
    # whose C/Python/conformance suite went red.
    #
    # The wheel and sdist jobs are here for the same reason from the other side.
    # `publish` waits for them, but this job used not to: a wheel leg that
    # failed on the tag -- only those legs run the suite on aarch64 and macOS --
    # left an immutable GitHub release published with nothing on PyPI behind it.
    # They are skipped on a release-* push, which must not skip the rehearsal,
    # hence the explicit `if:`: every need succeeded, or was one of the two
    # that may be skipped.
    needs: [msvc, mingw, linux, source, tests, build_wheels, build_sdist]
    if: >-
      !cancelled() &&
      needs.msvc.result == 'success' &&
      needs.mingw.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.source.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.build_wheels.result == 'success' || needs.build_wheels.result == 'skipped') &&
      (needs.build_sdist.result == 'success' || needs.build_sdist.result == 'skipped')
    runs-on: ubuntu-latest
    # The JOB runs on every push; only its last step is gated on a tag. This job
    # is irreversible the one time it matters, and gated as a whole it had never
    # run at all -- the artifact hand-off, the rename and the checksums would
    # have been executed for the first time on the release itself. Now every
    # push to main rehearses everything but the publication.
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      # Shallow is enough: this job only needs RELEASE_NOTES_<tag>.md, not history.
      - uses: actions/checkout@v5

      # No merge-multiple: the two Windows jobs pack archives with the SAME
      # filename (see the rename below), so flattening them into one directory
      # would silently drop one. Each artifact lands in staging/<artifact-name>/.
      - uses: actions/download-artifact@v8
        with:
          pattern: bovnar-*
          path: staging

      - name: Collect the packed archives
        run: |
          set -euo pipefail
          mkdir -p assets
          # pack_artifacts.cmake names the Windows zip after the TARGET, not the
          # toolchain, so MSVC and MinGW both produce bovnar-windows-<ver>-<count>
          # .zip. Actions artifacts have a directory each and so never collided;
          # a release's asset namespace is flat and one would have overwritten the
          # other. Fold the toolchain into the name on the way in.
          for tc in msvc mingw; do
            src=$(ls staging/bovnar-windows-"$tc"/bovnar-windows-*.zip)
            base=$(basename "$src" .zip)
            mv "$src" "assets/${base/bovnar-windows-/bovnar-windows-$tc-}.zip"
          done
          mv staging/bovnar-linux/*.tar.xz \
             staging/bovnar-amalgamate/*.tar.xz \
             staging/bovnar-source/*.tar.xz assets/
          ls -l assets

          # A build count of 0 means pack_artifacts.cmake could not reach git and
          # took its source-tarball fallback, which stamps the archive -- and the
          # directory inside it -- <version>-0. That is how the v1.1.0 MinGW zip
          # shipped mislabelled. Catch any future cause (missing git, a shallow
          # clone, dubious-ownership) here rather than on a permanent asset.
          if ls assets | grep -E -- '-0(\.tar\.xz|\.zip)$|-0-'; then
            echo "::error::an archive is stamped with build count 0 -- git was not reachable in its build job" >&2
            exit 1
          fi

      # Release assets are served over plain HTTPS with no provenance of their
      # own; ship the digests next to them so a download can be checked.
      - name: Checksums
        run: |
          set -euo pipefail
          cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish to the GitHub release
        # Only on a version tag (e.g. v2.0.0) -- the same gate the PyPI publish uses.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Pushing the tag alone is the supported way to cut a release: this
          # step creates it. Do NOT create the release in the GitHub UI first.
          #
          # The repository has release immutability switched on: a PUBLISHED
          # release accepts no further assets and its tag name can never be
          # reused (v1.0.0 is what publishing first leaves behind: immutable,
          # no assets). So nothing is published until every asset is attached
          # -- create a draft, upload, publish last -- and everything that can
          # be checked is checked before the first call that changes anything.
          version=$(grep -oP 'project\(bovnar VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag ${tag} does not name project version ${version} (expected v${version})"
            exit 1
          fi
          notes="RELEASE_NOTES_${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::${notes} is missing -- refusing to publish a permanent release with generated notes"
            exit 1
          fi
          want=$(cd assets && ls | LC_ALL=C sort | paste -sd,)
          err=$(mktemp)
          # releases/tags/<tag> answers only for a PUBLISHED release. Its
          # failing is "there is none" only when it failed with a 404: a 403, a
          # rate limit or a network error must not be read as permission to
          # create one.
          if state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '"\(.immutable) \([.assets[].name] | sort | join(","))"' 2>"$err"); then
            immutable="${state%% *}"
            have="${state#* }"
            if [ "$have" = "$want" ]; then
              # A re-run after a completed release.
              echo "::notice::release ${tag} is already published with exactly the expected assets -- nothing to do"
            elif [ "$immutable" != "false" ]; then
              # Published by hand, or from a half-filled draft. Nothing can be
              # attached any more, and saying "fine" here would let PyPI
              # publish a version whose GitHub release is incomplete.
              echo "::error::release ${tag} is published and immutable but its assets [${have}] are not [${want}] -- it cannot be completed. Delete it and cut the next version."
              exit 1
            else
              gh release upload "$tag" assets/* --clobber
            fi
          elif ! grep -q 'HTTP 404' "$err"; then
            cat "$err" >&2
            echo "::error::could not ask GitHub whether release ${tag} exists -- re-run this job"
            exit 1
          else
            if gh release view "$tag" >/dev/null 2>"$err"; then
              :   # a draft left by an earlier attempt of this job
            elif grep -q 'release not found' "$err"; then
              gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file "$notes"
            else
              cat "$err" >&2
              echo "::error::could not ask GitHub whether a draft of ${tag} exists -- re-run this job"
              exit 1
            fi
            gh release upload "$tag" assets/* --clobber
            gh release edit "$tag" --draft=false
          fi
