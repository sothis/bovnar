# Geany syntax-highlight configuration for Bovnar (.bvnr)
# Re-uses the Python lexer as the closest built-in approximation.
#
# Colour palette — designed for red-green colour-vision deficiency (CVD)
# and high contrast on a white background.
#
#   Hue selection avoids relying on the red/green axis:
#     Numbers  → blue   (#0055BB)  – cool, unambiguous
#     Strings  → amber  (#9B4300)  – warm, distinct from blue
#     Keywords → violet (#7000B0)  – structural, distinct from both
#     Units    → teal   (#006080)  – informational, third hue
#     Comments → grey   (#6A6A6A)  – receded, always readable
#     Operators→ dark   (#444444)  – subtle structural markers
#     Default  → black  (#1A1A1A)  – maximum contrast body text
#
# Format: foreground_colour;background_colour;bold;italic
# Colours use Geany/GTK RGB hex notation: 0xRRGGBB

[styling]
# 0 – default / unrecognised text
default=0x1A1A1A;0xFFFFFF;false;false

# 1 – line comment  (#…)
commentline=0x6A6A6A;0xFFFFFF;false;true

# 2 – numeric literal
number=0x0055BB;0xFFFFFF;false;false

# 3 – string literal  ("…")
string=0x9B4300;0xFFFFFF;false;false

# 4 – character literal (single-quote; not used by Bovnar, maps to unused slot)
character=0x9B4300;0xFFFFFF;false;false

# 5 – primary keywords  (type families uint sint float float_fix float_dec utf8 bool datetime
#       and reserved value keywords null true false on off)
word=0x7000B0;0xFFFFFF;true;false

# 6 – triple-quoted string (not used by Bovnar; maps to triple slot)
triple=0x9B4300;0xFFFFFF;false;false

# 7 – triple-double-quoted string (not used by Bovnar)
tripledouble=0x9B4300;0xFFFFFF;false;false

# 8 – class name (not used)
classname=0x1A1A1A;0xFFFFFF;false;false

# 9 – function/def name (not used)
defname=0x1A1A1A;0xFFFFFF;false;false

# 10 – operator / punctuation  (= ; . < > [ ] { } & $ : , /)
operator=0x444444;0xFFFFFF;true;false

# 11 – identifier (keys, symbols, reference segments not caught by keywords)
identifier=0x1A1A1A;0xFFFFFF;false;false

# 12 – block comment (not used by Bovnar)
commentblock=0x6A6A6A;0xFFFFFF;false;true

# 13 – unterminated string (error state)
stringeol=0xCC0000;0xFFEEEE;false;false

# 14 – secondary keywords (well-known unit names, no_unit)
word2=0x006080;0xFFFFFF;true;false

# 15 – decorator (@…, not used by Bovnar)
decorator=0x1A1A1A;0xFFFFFF;false;false

[keywords]
# Primary keywords – type-family names plus reserved value keywords.
# Seven type families (uint, sint, float, float_fix, float_dec, utf8, bool) and
# the value keywords null/true/false/on/off are part of the frozen spec 1.0;
# `datetime` is the spec-1.1 time family. The special floats nan/inf/ninf are
# bare reserved value keywords too (no sigil), so they colour like null/true.
#
# Limitation: because this filetype re-uses Geany's built-in Python lexer (see
# [settings]), the other spec-1.1 additions are not separately coloured — the
# version directive (#!bovnar 1.1) renders as a comment, an ISO-8601 datetime
# literal as a run of numbers/operators, and \u{…}/\xHH string escapes as
# ordinary string text. A dedicated lexer would be needed to style them.
primary=uint sint float float_fix float_dec utf8 bool datetime null true false on off nan inf ninf

# Secondary keywords – reserved unit names.
# Single-letter SI unit symbols (m, s, g, A, K …) are intentionally omitted
# because they clash with common identifier names in most files.
# Add them back locally if your files exclusively use them as units.
secondary=no_unit Hz mol Bq Gy Sv kat lm lx Wb Pa min in ft yd mi nmi ly pc fur fath lb oz gr st oz_t ct atm mmHg Torr psi cal Btu erg thm hp lbf dyn kip kn gal qt pt cup tbsp tsp bbl ac arcmin arcsec grad Mx Oe sb ph Ci rem Np dB Ra VA var rpm kgf inHg ft_lb dr dwt ch rd gi gi_uk inch inches foot feet yard yards mile miles angstrom parsec furlong fathom pound pounds ounce ounces grain grains stone short_ton long_ton troy_ounce carat fahrenheit atmosphere atmospheres torr calorie calories btu horsepower pound_force dyne dynes kip kips knot knots gallon gallons quart quarts pint pints cups barrel barrels acre acres barn barns arcminute arcsecond gradian gradians gon poise stokes gauss maxwell oersted stilb phot galileo curie roentgen neper decibel rankine slug thou mil mils pint_uk quart_uk fluid_ounce_uk volt_ampere kilogram_force inch_hg inch_mercury foot_pound foot_pounds dram drams pennyweight pennyweights chain chains rod rods gill gills gill_uk gills_uk gn PS CV rev turn turns revolution revolutions mo month months fn fortnight fortnights at atmosphere_technical tex den denier deniers fl_dr fluid_dram fluid_drams minim minims pk peck pecks bsh bushel bushels percent per_mille per_myriad per_cent_mille pcm ppm ppb

[settings]
extension=bvnr
# Closest available built-in lexer: Python handles '#' comments,
# "…" strings, numbers, and primary/secondary keyword lists.
lexer_filetype=Python
comment_single=#
# wordchars includes '+' and '-' so compound identifiers (my-key, my+key)
# are treated as single tokens by the Python lexer.
wordchars=_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-
